<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Desk · 美股观察工作台</title><meta name="description" content="集中观察美股行情、板块热力图、财经新闻与期权持仓分布。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css">
<script defer src="/vendor/vue.js"></script><script defer src="/vendor/echarts.js"></script><script type="module" src="/app.js"></script>
</head><body><div id="app" v-cloak>
<div class="ios-backdrop mobile-only" :class="{show:showSettings}" @click="closeSettings" aria-hidden="true"></div>
<aside id="workspace-settings" class="sidebar" :class="{'show-mobile':showSettings}" :inert="isMobile&&!showSettings" :role="isMobile?'dialog':undefined" :aria-modal="isMobile&&showSettings?'true':undefined" aria-label="工作台导航与自选" @keydown="handleDrawerKey">
  <button class="bottom-sheet-handle mobile-only" aria-label="关闭导航" @click="closeSettings"></button>
  <a class="brand" href="#overview" @click.prevent="navigate('overview')"><span class="brand-mark">MD</span><span>Market Desk<small>美股行情 · 新闻 · 期权</small></span></a>
  <div class="sidebar-divider"></div>
  <form class="control-stack" @submit.prevent="search"><label><span>股票代码 / Symbol</span><input aria-label="搜索美股代码" placeholder="NVDA / AAPL / SPY" v-model="searchInput" maxlength="12" autocomplete="off" spellcheck="false"></label><button class="primary-button" type="submit">查看行情</button></form>
  <div class="status-panel"><span class="status-dot"></span>公开数据 · 可能延迟</div>
  <div class="sidebar-divider"></div>
  <div class="nav-label">工作台</div><nav aria-label="主导航"><button v-for="item in nav" :key="item.id" :class="['nav-item',{active:page===item.id}]" @click="navigate(item.id)" :aria-current="page===item.id?'page':undefined"><span class="nav-icon">{{item.icon}}</span>{{item.label}}</button></nav>
  <div class="sidebar-divider"></div>
  <div class="sidebar-watch"><div class="nav-label">自选列表 <span>{{watchlist.length}} 支</span><button title="从已配置的 Notion 导入" @click="importNotion" :disabled="importing">{{importing?'导入中…':'↓ Notion'}}</button></div><div class="watch-chips"><div v-for="s in watchlist" :key="s" class="watch-row" :class="{active:page==='chart'&&symbol===s}"><button class="watch-item" @click="selectSymbol(s)">{{s}}</button><button class="remove" :aria-label="'移除 '+s" @click="removeWatch(s)">×</button></div></div><p v-if="!watchlist.length" class="muted small">搜索代码并加入自选。</p></div>
  <div class="sidebar-bottom"><span>外观</span><button class="theme-toggle" @click="toggleTheme" :aria-pressed="isDark">{{isDark?'切换浅色':'切换深色'}}</button></div>
</aside>
<div class="workspace" :inert="isMobile&&showSettings"><header class="topbar"><div class="topbar-left-wrapper"><button class="settings-trigger mobile-only" aria-label="打开导航与自选" aria-controls="workspace-settings" :aria-expanded="showSettings" @click="openSettings">☷</button><div><div class="eyebrow">MARKET DESK · {{currentNav.eyebrow}}</div><h1>{{page==='chart'?symbol:currentNav.label}}</h1></div></div><div class="topbar-right"><button class="theme-toggle desktop-only" @click="toggleTheme" :aria-pressed="isDark">{{isDark?'Light':'Dark'}}</button><div class="market-clock"><strong>{{nyClock}}</strong><small>NEW YORK</small></div><button class="refresh" @click="refresh" :disabled="refreshing">{{refreshing?'刷新中…':'↻ 刷新'}}</button></div></header>
<main><div v-if="toast" class="toast" role="status">{{toast}}<button aria-label="关闭提示" @click="toast=''">×</button></div><section class="page-heading"><p>{{currentNav.description}}</p><span class="date-label">{{dateLabel}}</span></section>

<template v-if="page==='overview'||page==='heatmap'">
  <div v-if="states.overview.loading&&!overview" class="loading-block">正在汇集指数、板块与精选美股行情…</div><div v-if="states.overview.error" class="error-box" role="alert">{{states.overview.error}} <button @click="loadOverview">重试</button></div>
  <template v-if="overview"><div class="index-grid"><button v-for="q in overview.benchmarks" :key="q.symbol" class="index-card" @click="selectSymbol(q.symbol)"><div class="index-name">{{q.name}}<span>{{q.symbol}}</span></div><div class="index-price">{{num(q.price)}}<small :class="tone(q.changePercent)">{{pct(q.changePercent)}}</small></div><div class="index-foot">{{time(q.asOf)}} <span v-if="q.stale" class="warning">旧快照</span></div></button></div>
  <div v-if="overview.unavailable.length" class="inline-note warning">暂缺行情：{{overview.unavailable.join('、')}}。仅显示成功返回的数据。</div>
  <div class="dashboard-grid" :class="{'heatmap-full':page==='heatmap'}"><section class="panel heatmap-panel"><div class="panel-heading"><div><h2>市场热力图 <span class="subtle-badge">精选美股</span></h2><p>颜色看涨跌，面积看成交活跃度</p></div><select v-model="heatSize" aria-label="热力图面积"><option value="turnover">估算成交额</option><option value="equal">等面积</option></select></div><div class="heatmap-toolbar"><div class="chips"><button :class="{selected:sectorFilter==='全部'}" @click="sectorFilter='全部'">全部</button><button v-for="s in stockSectors" :key="s" :class="{selected:sectorFilter===s}" @click="sectorFilter=s">{{s}}</button></div></div><div id="heatmap-chart" class="heatmap-chart" role="img" aria-label="精选美股涨跌热力图，点击股票查看详情"></div><div class="heatmap-footer"><span>点击方块 → 个股行情</span><div class="color-scale"><span>−3%</span><i></i><span>+3%</span></div></div><div class="panel-note">{{overview.note}}<br>Yahoo Finance · 最近交易 {{quoteWindow}} · 缓存 60 秒 <span v-if="overview.stocks.some(q=>q.stale)" class="warning">· 含旧快照</span></div></section>
  <section class="panel sector-panel"><div class="panel-heading"><div><h2>板块温度</h2><p>11 大板块 ETF · 当日涨跌</p></div><button class="text-button" @click="page='flows'">资金观察 ↗</button></div><div class="sector-list"><button v-for="q in rankedSectors" :key="q.symbol" class="sector-row" @click="selectSymbol(q.symbol)"><span>{{q.name}}<small>{{q.symbol}}</small></span><span class="sector-track"><i :class="tone(q.changePercent)" :style="{width:barWidth(q.changePercent)}"></i></span><strong :class="tone(q.changePercent)">{{pct(q.changePercent)}}</strong></button></div><div class="panel-note">板块 ETF 表现；不代表资金净流入。</div></section></div>
  <div v-if="page==='overview'" class="bottom-grid"><section class="panel"><div class="panel-heading"><div><h2>市场速读</h2><p>来自公开财经 RSS</p></div><button class="text-button" @click="page='news'">全部新闻 ↗</button></div><p v-if="states.news.loading&&!news" class="empty">正在加载新闻…</p><p v-if="states.news.error" class="empty">{{states.news.error}}</p><a v-for="(n,i) in (news?.items||[]).slice(0,4)" :key="n.url" :href="n.url" target="_blank" rel="noopener noreferrer" class="news-compact"><span class="news-number">0{{i+1}}</span><div><h3>{{n.title}}</h3><small>{{n.source}} · {{time(n.publishedAt)}}</small></div><span>↗</span></a></section><section class="panel market-summary"><div class="panel-heading"><div><h2>样本涨跌分布</h2><p>精选 {{overview.stocks.length}} 只股票</p></div></div><div class="breadth-number"><strong class="positive">{{breadth.up}}</strong><span>上涨</span><strong class="negative">{{breadth.down}}</strong><span>下跌</span></div><div class="breadth-track"><span :style="{width:breadth.up/Math.max(1,overview.stocks.length)*100+'%'}"></span></div><p>平盘 {{breadth.flat}} · 缺少涨跌幅 {{breadth.unknown}}</p><div class="summary-callout"><span>◈</span><div><strong>观察期权的持仓分布</strong><p>Call / Put 墙与估算 Gamma 敞口。</p><button class="text-button" @click="page='options'">打开期权墙 →</button></div></div></section></div></template>
</template>

<template v-if="page==='chart'"><section class="panel"><div class="panel-heading"><div><h2>{{symbol}} <span class="muted">{{chart?.name}}</span></h2><div v-if="chart" class="stock-price">{{num(chart.price)}} <small>{{chart.currency}}</small><span :class="tone(chart.changePercent)">{{pct(chart.changePercent)}}</span></div></div><div class="controls"><button @click="addWatch(symbol)">{{watchlist.includes(symbol)?'✓ 已在自选':'+ 加入自选'}}</button><select v-model="chartRange" aria-label="行情周期"><option value="1d">日内 · 5 分钟</option><option value="1mo">1 个月</option><option value="3mo">3 个月</option><option value="6mo">6 个月</option><option value="1y">1 年</option></select></div></div><div v-if="states.chart.loading" class="loading-block">正在获取 {{symbol}} 行情…</div><div v-if="states.chart.error" class="error-box">{{states.chart.error}} <button @click="loadChart">重试</button></div><div v-show="chart&&!states.chart.loading" id="price-chart" class="price-chart" role="img" :aria-label="symbol+'价格与成交量图'"></div><div v-if="chart" class="panel-note">{{chart.source}} · {{chart.delay}} · 最新交易 {{time(chart.asOf)}} · {{chart.bars.length}} 根 K 线 · 最新一根可能尚未收盘 <strong v-if="chart.stale" class="warning">· 旧快照</strong></div></section><div class="quick-actions"><button @click="optionSymbol=symbol;page='options'">{{symbol}} 期权墙 →</button><button @click="newsSymbol=symbol;page='news'">{{symbol}} 相关新闻 →</button></div></template>

<template v-if="page==='flows'"><div class="tabs"><button :class="{selected:flowTab==='rotation'}" @click="flowTab='rotation'">板块轮动与成交</button><button :class="{selected:flowTab==='net'}" @click="flowTab='net'">ETF 净申赎</button></div><section v-if="flowTab==='rotation'" class="panel"><div class="panel-heading"><div><h2>资金关注哪些板块？</h2><p>横轴：当日涨跌幅 · 纵轴：估算成交额（美元）</p></div></div><div v-if="states.overview.error" class="error-box">{{states.overview.error}} <button @click="loadOverview">重试</button></div><div v-if="!overview" class="loading-block">正在加载板块行情…</div><div id="rotation-chart" class="wide-chart" role="img" aria-label="板块涨跌幅与成交额散点图"></div><div class="panel-note">估算成交额 = 最新价 × 当日成交股数，用于比较活跃度。交易有买有卖，不能由此推断净流入、主力买卖或 ETF 净申赎。Yahoo Finance · 可能延迟。</div></section>
<section v-else class="panel"><div class="panel-heading"><div><h2>ETF 每日净申赎</h2><p>正数为净流入，负数为净流出 · 单位 USD</p></div><div class="controls"><select v-if="flowDates.length" v-model="flowDate" aria-label="净申赎日期"><option v-for="d in flowDates" :key="d">{{d}}</option></select><label class="button">导入 CSV<input type="file" accept=".csv,text/csv" @change="importFlows" hidden></label></div></div><div v-if="!flows.length" class="empty-state"><div class="empty-icon">⇄</div><h3>接入你有来源的资金流数据</h3><p>目前公开行情源不提供可靠的 ETF 每日净申赎。<br>导入发行商或数据服务导出的数值后，即可比较每日资金流向。</p><code>date,symbol,netFlowUsd,source</code><p class="small">使用 YYYY-MM-DD 日期、美元金额、来源名称；每个代码每天一行。<br>导入内容仅保存在当前浏览器。</p></div><template v-else><div id="flows-chart" class="wide-chart" role="img" aria-label="ETF净申赎柱状图"></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>代码</th><th>净申赎 USD</th><th>来源（用户提供）</th></tr></thead><tbody><tr v-for="f in dayFlows" :key="f.symbol"><td>{{f.date}}</td><td>{{f.symbol}}</td><td :class="tone(f.netFlowUsd)">{{compact(f.netFlowUsd)}}</td><td>{{f.source}}</td></tr></tbody></table></div><div class="panel-note">仅展示导入数值，未独立核验来源。<button class="text-button" @click="clearFlows">清空导入</button></div></template></section></template>

<template v-if="page==='options'"><section class="panel"><div class="panel-heading"><div><h2>期权持仓地图</h2><p>Cboe 延迟快照 · 标准股票 / ETF 期权，合约乘数 100</p></div><form class="controls" @submit.prevent="loadOptions(true)"><input aria-label="期权标的" v-model="optionSymbol" placeholder="SPY" maxlength="12"><button type="submit" :disabled="states.options.loading">查看</button><select v-if="options" v-model="optionExpiry" aria-label="期权到期日"><option value="all">全部未过期日</option><option v-for="d in options.expirations" :key="d" :value="d">{{d}}</option></select></form></div><div v-if="states.options.loading" class="loading-block">正在加载 {{optionSymbol.toUpperCase()}} 期权链…</div><div v-if="states.options.error" class="error-box" role="alert">{{states.options.error}} <button @click="loadOptions(true)">重试</button></div><template v-if="options&&!states.options.loading"><div class="options-stats"><div><span>{{options.symbol}} 标的价格</span><strong>{{num(options.spot)}}</strong></div><div><span>Call OI 墙</span><strong class="positive">{{walls(options.callWall)}}</strong></div><div><span>Put OI 墙</span><strong class="negative">{{walls(options.putWall)}}</strong></div><div><span>Put / Call 持仓比</span><strong>{{num(options.putCallRatio)}}</strong></div><div><span>估算净 GEX / 1% 波动</span><strong :class="tone(options.netGex)">{{compact(options.netGex)}}</strong></div></div><div class="options-toolbar"><div class="tabs"><button :class="{selected:optionMetric==='oi'}" @click="optionMetric='oi'">持仓量 OI</button><button :class="{selected:optionMetric==='gex'}" @click="optionMetric='gex'">估算 GEX</button></div><label>行权价范围 <select v-model="strikeRange"><option value="0.15">现价 ±15%</option><option value="0.3">现价 ±30%</option><option value="all">全部</option></select></label></div><div v-if="options.missingOi||options.missingGamma" class="inline-note warning">数据缺失：OI {{options.missingOi}} 条，Gamma {{options.missingGamma}} 条。受影响汇总显示为 —。</div><div id="options-chart" class="wide-chart" role="img" aria-label="Call和Put按行权价的持仓量或估算Gamma敞口"></div><div class="panel-note">{{options.methodology}}<br>{{options.source}} · 源站时间 {{options.asOf}}（原始值，未推定时区） · 获取 {{time(options.fetchedAt)}} · {{options.contracts}} 份合约记录 · 缓存 15 分钟 <strong v-if="options.stale" class="warning">· 旧快照</strong><br>墙值基于所选到期日的全部行权价；图表范围筛选不会改变墙值。集中持仓不保证构成支撑或阻力。</div></template></section></template>

<template v-if="page==='news'"><div class="news-controls"><div class="tabs"><button :class="{selected:!newsSymbol}" @click="newsSymbol=''">市场新闻</button><button v-for="s in watchlist.slice(0,6)" :key="s" :class="{selected:newsSymbol===s}" @click="newsSymbol=s">{{s}}</button></div><form class="controls" @submit.prevent="newsSymbol=newsSearch.trim().toUpperCase()"><input v-model="newsSearch" aria-label="新闻股票代码" placeholder="代码筛选"><button type="submit">查看</button></form></div><div v-if="states.news.loading" class="loading-block">正在读取新闻源…</div><div v-if="states.news.error" class="error-box">{{states.news.error}} <button @click="loadNews">重试</button></div><template v-if="news"><div class="inline-note">{{news.symbol?news.symbol+' 相关新闻':'市场新闻'}} · {{news.items.length}} 条 · 获取 {{time(news.fetchedAt)}} · RSS 缓存 5 分钟 <span v-if="news.stale" class="warning">· 旧快照</span><span v-if="news.unavailable.length" class="warning"> · 暂缺 {{news.unavailable.join('、')}}</span></div><div class="news-grid"><a v-for="n in news.items" :key="n.url" :href="n.url" target="_blank" rel="noopener noreferrer" class="panel news-card"><div><span class="source-label">{{n.source}}</span><span>↗</span></div><h2>{{n.title}}</h2><small>{{time(n.publishedAt)}} · 阅读原文</small></a></div></template></template>

<template v-if="page==='sources'"><section class="panel documentation"><h2>每一个图表，都有明确的数据口径</h2><div class="table-wrap"><table><thead><tr><th>模块</th><th>来源与刷新</th><th>如何阅读</th></tr></thead><tbody><tr><td>行情 / 热力图</td><td>Yahoo Finance · 60 秒缓存</td><td>可能延迟；显示源站最近交易时间。18 只精选股不代表全市场。</td></tr><tr><td>资金观察</td><td>11 个板块 ETF / 用户 CSV</td><td>成交活跃度与 ETF 净申赎分别显示，不推算主力净流入。</td></tr><tr><td>期权墙</td><td>Cboe · 15 分钟缓存</td><td>延迟快照；OI 通常每日更新。GEX 是带符号假设的估算。</td></tr><tr><td>新闻</td><td>CNBC、MarketWatch、Yahoo RSS · 5 分钟缓存</td><td>标题、来源、发布时间与原文链接。</td></tr><tr><td>自选</td><td>浏览器本地 / 已配置的 Notion 导入</td><td>手动导入后本地保存；未实现跨设备同步。</td></tr></tbody></table></div><h2>开源融合</h2><p><a href="https://github.com/aaguiar10/gflows" target="_blank" rel="noopener">G|Flows · MIT</a>：移植 Cboe 接入和按行权价计算的逻辑，补充校验、缺失值处理和明确单位。</p><p><a href="https://github.com/apache/echarts" target="_blank" rel="noopener">Apache ECharts · Apache-2.0</a>：热力图、K 线、板块轮动及期权分布图。</p><p><a href="https://github.com/Open-Dev-Society/OpenStock" target="_blank" rel="noopener">OpenStock</a>、<a href="https://github.com/openbq-org/OpenBB" target="_blank" rel="noopener">OpenBB</a>：产品与数据分层参考，未复制其应用代码。</p><h2>产品定位</h2><p>Market Desk 是美股信息与分析辅助工作台。旧版拐点策略、买卖标记和胜率回测入口已停用，历史代码保留归档。网络失败会显示明确状态，已有缓存会标注为旧快照。</p></section></template>
<footer>MARKET DESK <span>信息辅助 · 数据可能延迟 · 不自动生成买卖指令</span><button class="text-button" @click="page='sources'">数据来源与口径 ↗</button></footer>
</main></div><nav class="ios-tab-bar mobile-only" aria-label="底部导航" :inert="isMobile&&showSettings"><button v-for="item in mobileNav" :key="item.id" :class="['tab-item',{active:page===item.id}]" :aria-current="page===item.id?'page':undefined" @click="navigate(item.id)"><span class="tab-icon">{{item.icon}}</span>{{item.label}}</button><button class="tab-item" @click="openSettings"><span class="tab-icon">☷</span>更多</button></nav></div><noscript>请启用 JavaScript 以使用 Market Desk。</noscript></body></html>
